services:
  postgres:
    image: postgres:17
    container_name: memora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - memora-network

volumes:
  postgres_data:

networks:
  memora-network:
    driver: bridge